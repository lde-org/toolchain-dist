name: Build

on:
  workflow_dispatch:

# ── version pins ─────────────────────────────────────────────────
env:
  LLVM_MINGW_VER: "20260616"
  # Bump this to force a cache miss and full rebuild.
  TOOLCHAIN_REV: "1"

permissions:
  contents: write

jobs:
  build:
    name: Toolchain (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            os: windows-latest
            target: x86_64-w64-mingw32
            # llvm-mingw uses x86_64 (underscore) in asset names
            url_arch: x86_64
          - arch: aarch64
            os: windows-11-arm
            target: aarch64-w64-mingw32
            url_arch: aarch64

    steps:
      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: toolchain-windows-${{ matrix.arch }}.7z
          key: toolchain-${{ matrix.arch }}-${{ env.LLVM_MINGW_VER }}-${{ env.TOOLCHAIN_REV }}

      # ── download & extract ──────────────────────────────────────

      - name: Download llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/" `
               + "$env:LLVM_MINGW_VER/llvm-mingw-$env:LLVM_MINGW_VER-ucrt-${{ matrix.url_arch }}.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          7z x llvm-mingw.zip -o"raw" -y | Out-Null

      - name: Normalize tree
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          shopt -s extglob
          root=raw/toolchain
          target='${{ matrix.target }}'

          # rename extracted dir to toolchain/
          mv raw/llvm-mingw-* "$root"

          # move busybox sh into bin/
          cp "$root"/busybox/bin/{busybox,sh}.exe "$root/bin/"

          # ── strip binaries ──
          find "$root" -type f \( -name "*.exe" -o -name "*.dll" \) -print0 \
            | xargs -0 -P4 "$root/bin/strip.exe" --strip-unneeded 2>/dev/null || true

          # ── prune: remove top-level cruft ──
          rm -rf "$root"/{share,python,busybox}

          # ── prune: remove non-native cross-compilation targets ──
          for d in "$root"/*-w64-mingw32; do
            [[ "$(basename "$d")" != "$target" ]] && rm -rf "$d"
          done

          # ── prune: bin/ whitelist ──
          keep=(
            # compiler
            clang.exe clang++.exe clang-22.exe
            clang-target-wrapper.exe
            # linker
            ld.lld.exe
            # binutils
            llvm-ar.exe llvm-ranlib.exe llvm-nm.exe
            llvm-objcopy.exe llvm-objdump.exe llvm-strip.exe
            llvm-dlltool.exe llvm-windres.exe
            llvm-size.exe llvm-readobj.exe
            llvm-rc.exe llvm-cvtres.exe
            llvm-cxxfilt.exe llvm-strings.exe
            # GCC-compat wrappers
            gcc.exe g++.exe cc.exe c++.exe c99.exe c11.exe
            ar.exe ranlib.exe nm.exe
            strip.exe objcopy.exe objdump.exe
            dlltool.exe windres.exe size.exe
            addr2line.exe strings.exe readelf.exe
            # ld wrapper script
            ld
            # make
            mingw32-make.exe
            # busybox / shell
            busybox.exe sh.exe
          )
          for f in "$root/bin/"*.exe; do
            name=$(basename "$f")
            match=false
            for k in "${keep[@]}"; do
              [[ "$name" == "$k" ]] && match=true && break
            done
            $match || rm -f "$f"
          done

          # ── prune: DLLs from removed components (lldb, python, asan, omp) ──
          rm -f "$root"/bin/{liblldb,lldb-*,libpython*,libffi-*}.dll
          rm -f "$root"/bin/libclang_rt.asan*
          rm -f "$root"/bin/libomp.dll

          # ── prune: clang runtime: drop linux/ (cross-lib), sanitizers, fuzzers ──
          clanglib="$root/lib/clang/22"
          rm -rf "$clanglib"/lib/linux "$clanglib"/share "$clanglib"/bin
          for lib in fuzzer ubsan stats profile xray hwasan lsan tsan msan scudo memprof gwp_asan nsan dfsan asan safe_stack; do
            rm -f "$clanglib"/lib/windows/libclang_rt.{"$lib","$lib"_*}*
          done

          # ── prune: target sysroot share/ and unneeded DLLs ──
          rm -rf "$root/$target/share"
          rm -f "$root/$target"/bin/{libomp,libclang_rt.asan*}.dll "$root/$target"/bin/libclang_rt.asan*

          echo "Pruned size: $(du -sh "$root" | cut -f1)"

      # ── repack ───────────────────────────────────────────────────

      - name: Repack as 7z
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd raw && 7z a -t7z -mx=9 -mmt=on -ms=on "$OLDPWD/toolchain-windows-${{ matrix.arch }}.7z" toolchain | tail -2

      # ── smoke test ───────────────────────────────────────────────

      - name: Smoke test
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          7z x "toolchain-windows-${{ matrix.arch }}.7z" -overify -y >/dev/null
          bin=verify/toolchain/bin
          "$bin/gcc.exe" --version
          "$bin/mingw32-make.exe" --version
          "$bin/sh.exe" -c "echo sh ok"
          echo "Smoke test passed."

      # ── publish ─────────────────────────────────────────────────

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          prerelease: false
          make_latest: true
          files: toolchain-windows-${{ matrix.arch }}.7z
